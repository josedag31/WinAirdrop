# Push a vX.Y.Z tag to run the tests, build WinAirdrop.exe, the installer and
# the portable .zip, and publish them as a GitHub Release:
#   git tag v1.0.0
#   git push origin v1.0.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

      - name: Check the tag matches __version__
        shell: pwsh
        run: |
          # v1.2.3 or a pre-release like v1.2.3-rc1 (published as "Pre-release").
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $code = (Select-String -Path winairdrop.py -Pattern '^__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ($tag.Split("-")[0] -ne $code) { throw "Tag v$tag does not match __version__ $code in winairdrop.py" }
          "VERSION=$tag" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build WinAirdrop.exe
        run: >
          python installer/make_version_info.py ${{ env.VERSION }} build/version_info.txt &&
          pyinstaller --noconfirm --onefile --noconsole --name WinAirdrop
          --version-file build/version_info.txt
          --icon assets/icon.ico --add-data "setup.html;." --add-data "locales;locales"
          --collect-submodules zeroconf winairdrop.py

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=$env:VERSION" "/DSourceExe=..\dist\WinAirdrop.exe" installer\WinAirdrop.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Package portable zip and checksums
        shell: pwsh
        run: |
          $name = "WinAirdrop-v$env:VERSION-portable"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item dist\WinAirdrop.exe, setup-firewall.ps1, install-startup.ps1, start.ps1, .env.example, README.md, LICENSE $name
          # A .env next to the .exe makes the portable copy keep its settings in its own folder.
          New-Item -ItemType File "$name\.env" | Out-Null
          Compress-Archive -Path "$name\*" -DestinationPath "dist\$name.zip"
          Get-ChildItem dist\WinAirdrop-Setup-*.exe, "dist\$name.zip" | ForEach-Object {
            (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name
          } | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WinAirdrop-Setup-*.exe
            dist/WinAirdrop-*-portable.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
