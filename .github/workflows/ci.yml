name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt pip-audit pyflakes
      - name: Lint
        run: python -m pyflakes winairdrop.py tests
      - name: Tests
        run: python -m pytest -q
      - name: Known vulnerabilities in dependencies
        run: python -m pip_audit -r requirements.txt --progress-spinner off
